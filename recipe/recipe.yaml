schema_version: 1

context:
  name: summarytools
  version: "0.4.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/summarytools-${{ version }}.tar.gz
  sha256: ab90368dacaff4c6f728a44d5d13327596e890b59dcc2e099ac3228eaa7fd09d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pandas >=1.4.0
    - ipython >=7.20.0
    - numpy >=1.18.5
    - matplotlib-base >=3.3.0
    - jinja2 >=3.1

tests:
  - python:
      imports:
        - summarytools
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: summarytools in jupyter notebook
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/6chaoran/jupyter-summarytools

extra:
  recipe-maintainers:
    - thewchan
